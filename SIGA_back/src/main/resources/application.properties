spring.application.name=SIGA

# Importación nativa del archivo .env unificado en la raíz del proyecto
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Base de Datos PostgreSQL (NeonDB Cloud - Variables PG* del .env raíz)
spring.jpa.database=postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:ep-floral-mountain-axh8eu0l-pooler.c-4.us-east-2.aws.neon.tech}:5432/${PGDATABASE:neondb}?sslmode=${PGSSLMODE:require}&channelBinding=${PGCHANNELBINDING:require}}
spring.datasource.username=${DB_USERNAME:${PGUSER:neondb_owner}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:npg_S4t8uKoFxjUn}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Seguridad JWT y API Key M2M
siga.security.jwt-secret=${JWT_SECRET:change-this-secret-in-development-minimum-32-characters}
siga.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}
siga.security.external-api-key=${EXTERNAL_API_KEY:siga-uds-external-access-key-2026,QkwVBVttNYjyshnyoRv3z9QiP7uso5ZQD_kzadrWU6k}
siga.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,https://ghost-kitchen-nusq.onrender.com}

# Integración UDS: Ghost Kitchen (BFF Proxy)
siga.integration.ghost-kitchen.url=${GHOST_KITCHEN_URL:https://ghost-kitchen-nusq.onrender.com/api/v1/informes/}
siga.integration.ghost-kitchen.token=${GHOST_KITCHEN_TOKEN:QkwVBVttNYjyshnyoRv3z9QiP7uso5ZQD_kzadrWU6k}

# Usuario inicial para desarrollo local
siga.seed.admin-email=${SEED_ADMIN_EMAIL:admin@siga.local}
siga.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123!}

# Firebase Admin SDK (requerido para activar /api/v1/auth/firebase)
siga.firebase.enabled=${FIREBASE_ENABLED:false}
siga.firebase.project-id=${FIREBASE_PROJECT_ID:}
siga.firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
siga.firebase.private-key=${FIREBASE_PRIVATE_KEY:}
siga.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
siga.firebase.service-account-json-base64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}

# Cloudinary Storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

