<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo circular con gradiente verde esmeralda institucional -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Contenedor redondeado con sombra sutil -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Canasta / Caja de Alimentos Solidaria (Base) -->
  <path d="M14 36 L18 52 C18.5 54 20.2 55.5 22.5 55.5 L41.5 55.5 C43.8 55.5 45.5 54 46 52 L50 36 Z" 
        fill="url(#basketGrad)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Listones de la canasta -->
  <path d="M22 36 L24 55.5 M32 36 L32 55.5 M42 36 L40 55.5" 
        stroke="#92400e" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M15 45 L49 45" 
        stroke="#92400e" stroke-width="1.2" opacity="0.4"/>

  <!-- Borde superior de la caja / canasta -->
  <rect x="12" y="34" width="40" height="5" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>

  <!-- Espiga de trigo / Granos (Derecha) -->
  <g transform="translate(42, 22) rotate(22)">
    <path d="M0 16 L0 0" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="-2.5" cy="3" rx="2" ry="3.5" fill="#fde047" transform="rotate(-30 -2.5 3)"/>
    <ellipse cx="2.5" cy="5" rx="2" ry="3.5" fill="#fde047" transform="rotate(30 2.5 5)"/>
    <ellipse cx="-2.5" cy="8" rx="2" ry="3.5" fill="#fde047" transform="rotate(-30 -2.5 8)"/>
    <ellipse cx="2.5" cy="10" rx="2" ry="3.5" fill="#fde047" transform="rotate(30 2.5 10)"/>
    <ellipse cx="0" cy="0" rx="1.8" ry="3" fill="#fef08a"/>
  </g>

  <!-- Manzana Nutritiva (Centro - Izquierda) -->
  <g transform="translate(24, 25)">
    <!-- Cuerpo de la manzana -->
    <path d="M 0 3 C -4 -4, -12 -2, -12 6 C -12 14, -3 18, 0 18 C 3 18, 12 14, 12 6 C 12 -2, 4 -4, 0 3 Z" 
          fill="url(#appleGrad)" stroke="#991b1b" stroke-width="1"/>
    <!-- Tallo -->
    <path d="M 0 3 C 0.5 -1, 2 -4, 4 -5" 
          stroke="#78350f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Hoja verde -->
    <path d="M 1 0 C 4 -3, 8 -3, 9 -1 C 9 2, 6 3, 1 0 Z" 
          fill="url(#leafGrad)"/>
    <!-- Brillo sutil de la manzana -->
    <path d="M -9 4 C -9 2, -6 0, -4 0" 
          stroke="#fecaca" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Corazón de Solidaridad en el centro de la canasta -->
  <path d="M32 44.5 C32 44.5, 27 41, 27 38.5 C27 36.8 28.3 35.5 30 35.5 C31 35.5 31.8 36 32 36.8 C32.2 36 33 35.5 34 35.5 C35.7 35.5 37 36.8 37 38.5 C37 41, 32 44.5, 32 44.5 Z" 
        fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
</svg>
